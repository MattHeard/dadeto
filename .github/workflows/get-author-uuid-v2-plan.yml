name: get-author-uuid-v2-plan

on:
  workflow_dispatch:
    inputs:
      plan_scope:
        description: Terraform resources to preview
        required: true
        type: choice
        options:
          - get-author-uuid-v2
          - function-endpoint-registry
        default: get-author-uuid-v2

permissions:
  contents: read

jobs:
  terraform-plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: infra
    env:
      REGION: europe-west1
      GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      CLOUDSDK_CORE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      ENVIRONMENT: prod
      TF_VAR_environment: prod
      TF_VAR_project_level_environment: prod
      TF_VAR_database_id: production-restore-2026-07-01-08-59
      TF_VAR_billing_enabled: ${{ vars.PROD_BILLING_ENABLED || 'false' }}
      TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      TF_VAR_production_alert_email: ${{ secrets.PRODUCTION_ALERT_EMAIL }}
      TF_VAR_create_default_firestore_database: 'false'
      TF_VAR_codex_vm_enabled: ${{ secrets.CODEX_ADMIN_MEMBER != '' }}
      TF_VAR_codex_admin_member: ${{ secrets.CODEX_ADMIN_MEMBER }}
      PLAN_SCOPE: ${{ inputs.plan_scope }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build Cloud Function package
        working-directory: ./
        run: |
          npm ci
          npm run build:cloud

      - name: Set up Google Cloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Initialize production state
        run: terraform init -input=false

      - name: Create scoped production plan
        run: |
          set -euo pipefail
          case "$PLAN_SCOPE" in
            get-author-uuid-v2)
              targets=(
                "-target=google_cloudfunctions2_function.get_author_uuid_v2"
                "-target=google_cloud_run_service_iam_member.get_author_uuid_v2_public"
                "-target=google_storage_bucket_object.dendrite_static_config"
              )
              ;;
            function-endpoint-registry)
              targets=(
                "-target=google_storage_bucket.function_endpoint_registry"
                "-target=google_storage_bucket_iam_member.function_endpoint_registry_public_reader"
                "-target=google_storage_bucket_object.function_endpoint_registry"
              )
              ;;
            *)
              echo "::error::Unsupported Terraform plan scope: ${PLAN_SCOPE}"
              exit 64
              ;;
          esac
          if ! terraform plan \
              "${targets[@]}" \
              -lock-timeout=5m \
              -input=false \
              -var="environment=${ENVIRONMENT}" \
              -out="$RUNNER_TEMP/${PLAN_SCOPE}.tfplan" \
              > "$RUNNER_TEMP/terraform-plan.log" 2>&1; then
            echo "::error::Terraform plan failed; full plan output remains on the ephemeral runner."
            exit 1
          fi

      - name: Summarize resource actions without values
        run: |
          set -euo pipefail
          terraform show -json "$RUNNER_TEMP/${PLAN_SCOPE}.tfplan" |
            jq -r --arg plan_scope "$PLAN_SCOPE" '
              "## \($plan_scope) production plan\n\nNo apply was run. Changed Terraform addresses and actions:\n",
              (.resource_changes[]? | select(.change.actions != ["no-op"]) |
                "- `\(.address)`: `\(.change.actions | join(", "))`")
            ' | tee -a "$GITHUB_STEP_SUMMARY"
