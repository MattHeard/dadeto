name: gcp-prod

on:
  workflow_run:
    workflows: ["gcp-test"]
    types: [completed]
  workflow_dispatch:
jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: infra
    env:
      REGION: europe-west1
      GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      CLOUDSDK_CORE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      ENVIRONMENT: prod
      TF_VAR_environment: prod
      TF_VAR_project_level_environment: prod
      TF_VAR_database_id: production-restore-2026-07-01-08-59
      TF_VAR_billing_enabled: ${{ vars.PROD_BILLING_ENABLED || 'false' }}
      TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      TF_VAR_production_alert_email: ${{ secrets.PRODUCTION_ALERT_EMAIL }}
      TF_VAR_create_default_firestore_database: 'false'
      TF_VAR_codex_vm_enabled: ${{ secrets.CODEX_ADMIN_MEMBER != '' }}
      TF_VAR_codex_admin_member: ${{ secrets.CODEX_ADMIN_MEMBER }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build cloud function sources and Dendrite static site
        working-directory: ./
        run: |
          npm ci
          npm run build:dendritestories-co-nz
          npm run build:cloud

      - name: Set up Google Cloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GOOGLE_PROJECT }}
          install_components: alpha

      - name: Log Google Cloud authentication details
        run: |
          gcloud auth list
          gcloud config list account
          gcloud config get-value project

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Cache Terraform plugin dir
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('infra/**/.terraform.lock.hcl') }}

      - name: Terraform environment configuration
        run: |
          plugin_cache_dir="${HOME}/.terraform.d/plugin-cache"
          mkdir -p "$plugin_cache_dir"
          printf 'plugin_cache_dir = "%s"\n' "$plugin_cache_dir" > ~/.terraformrc

      - name: Terraform Init (Validate)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Init
        run: terraform init -migrate-state

      - name: Remove stale Firestore field state
        run: terraform state rm google_firestore_field.pages_all || true

      - name: Import existing Firestore database
        run: |
          database_resource="google_firestore_database.database[0]"
          database_path="projects/${GOOGLE_PROJECT}/databases/${TF_VAR_database_id}"

          if ! terraform state list | grep -Fxq "${database_resource}"; then
            terraform import -lock-timeout=5m "${database_resource}" "${database_path}"
          fi

          import_if_missing() {
            resource_name="$1"
            resource_id="$2"

            if ! terraform state list | grep -Fxq "$resource_name"; then
              terraform import -lock-timeout=5m "$resource_name" "$resource_id"
            fi
          }

          import_if_missing "google_firestore_index.variants_author_created[0]" "projects/${GOOGLE_PROJECT}/databases/${TF_VAR_database_id}/collectionGroups/variants/indexes/CICAgJiUpoMK"
          import_if_missing "google_firestore_field.variants_tree_weights_dirty[0]" "projects/${GOOGLE_PROJECT}/databases/${TF_VAR_database_id}/collectionGroups/variants/fields/targetTreeWeightsDirty"
          import_if_missing "google_firestore_index.variants_moderation_rand[0]" "projects/${GOOGLE_PROJECT}/databases/${TF_VAR_database_id}/collectionGroups/variants/indexes/CICAgJjF9oIK"
          import_if_missing "google_firestore_index.ratings_by_variant[0]" "projects/${GOOGLE_PROJECT}/databases/${TF_VAR_database_id}/collectionGroups/moderationRatings/indexes/CICAgOjXh4EK"

      - name: Terraform Plan
        run: terraform plan -lock-timeout=5m -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -lock-timeout=5m -auto-approve tfplan

      - name: Prepare get-author-uuid-v2 smoke deployment metadata
        if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == github.event.repository.default_branch
        env:
          SOURCE_GCP_TEST_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_GCP_TEST_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_GCP_TEST_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPLOYMENT_ORIGIN: https://www.dendritestories.co.nz
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_GCP_TEST_RUN_ID" =~ ^[0-9]+$ ]] || [[ "$SOURCE_GCP_TEST_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Refusing to publish smoke metadata for an unlinked or non-default-branch deployment."
            exit 1
          fi
          firebase_config="$(terraform output -json firebase_web_app_config | jq -c 'if type == "object" and has("value") then .value else . end')"
          endpoint_url="$(terraform output -raw get_author_uuid_v2_url)"
          jq -e '.apiKey and .tenantId and .projectId' <<< "$firebase_config" >/dev/null
          test -n "$endpoint_url"
          jq -n \
            --arg test_run_id "$SOURCE_GCP_TEST_RUN_ID" \
            --arg test_head_sha "$SOURCE_GCP_TEST_HEAD_SHA" \
            --arg test_branch "$SOURCE_GCP_TEST_BRANCH" \
            --arg prod_run_id "$GITHUB_RUN_ID" \
            --arg deployed_head_sha "$SOURCE_GCP_TEST_HEAD_SHA" \
            --arg endpoint_url "$endpoint_url" \
            --arg origin "$DEPLOYMENT_ORIGIN" \
            --argjson firebase "$firebase_config" \
            '{
              schemaVersion: 1,
              gcpTest: { runId: $test_run_id, headSha: $test_head_sha, branch: $test_branch },
              gcpProd: { runId: $prod_run_id, deployedHeadSha: $deployed_head_sha },
              endpointUrl: $endpoint_url,
              origin: $origin,
              firebase: {
                projectId: $firebase.projectId,
                tenantId: $firebase.tenantId,
                apiKey: $firebase.apiKey
              }
            }' > "$RUNNER_TEMP/get-author-uuid-v2-deployment.json"

      - name: Upload get-author-uuid-v2 smoke deployment metadata
        if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == github.event.repository.default_branch
        uses: actions/upload-artifact@v6
        with:
          name: get-author-uuid-v2-deployment
          path: ${{ runner.temp }}/get-author-uuid-v2-deployment.json
          if-no-files-found: error
          retention-days: 7
