name: get-author-uuid-v2-production-smoke

on:
  workflow_run:
    workflows: ["gcp-prod"]
    types: [completed]

permissions: {}

concurrency:
  group: get-author-uuid-v2-production-smoke-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the trusted default-branch smoke runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Download metadata from this gcp-prod run
        uses: actions/download-artifact@v6
        with:
          name: get-author-uuid-v2-deployment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/get-author-uuid-v2-deployment

      - name: Install Firebase Admin runtime dependencies
        run: npm ci --prefix src/cloud/runtime-deps

      - name: Verify smoke-only Workload Identity Federation settings
        env:
          GET_AUTHOR_UUID_SMOKE_WIF_PROVIDER: ${{ vars.GET_AUTHOR_UUID_SMOKE_WIF_PROVIDER }}
          GET_AUTHOR_UUID_SMOKE_RUNNER_SERVICE_ACCOUNT: ${{ vars.GET_AUTHOR_UUID_SMOKE_RUNNER_SERVICE_ACCOUNT }}
          GET_AUTHOR_UUID_SMOKE_SIGNER_SERVICE_ACCOUNT: ${{ vars.GET_AUTHOR_UUID_SMOKE_SIGNER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "${GET_AUTHOR_UUID_SMOKE_WIF_PROVIDER:-}" ]] || \
            [[ -z "${GET_AUTHOR_UUID_SMOKE_RUNNER_SERVICE_ACCOUNT:-}" ]] || \
            [[ -z "${GET_AUTHOR_UUID_SMOKE_SIGNER_SERVICE_ACCOUNT:-}" ]]; then
            echo "::error::Missing smoke Workload Identity Federation variables; follow the one-time setup in notes/agents/2026-10-18-get-author-uuid-v2-production-smoke.md."
            exit 1
          fi

      - name: Authenticate with the smoke-only Google identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GET_AUTHOR_UUID_SMOKE_WIF_PROVIDER }}
          service_account: ${{ vars.GET_AUTHOR_UUID_SMOKE_RUNNER_SERVICE_ACCOUNT }}

      - name: Run the linked production smoke test
        env:
          GET_AUTHOR_UUID_SMOKE_DEPLOYMENT_METADATA: ${{ runner.temp }}/get-author-uuid-v2-deployment/get-author-uuid-v2-deployment.json
          GET_AUTHOR_UUID_SMOKE_EXPECTED_GCP_PROD_RUN_ID: ${{ github.event.workflow_run.id }}
          GET_AUTHOR_UUID_SMOKE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GET_AUTHOR_UUID_SMOKE_SIGNER_SERVICE_ACCOUNT: ${{ vars.GET_AUTHOR_UUID_SMOKE_SIGNER_SERVICE_ACCOUNT }}
        run: node scripts/get-author-uuid-v2-production-smoke.js --execute
