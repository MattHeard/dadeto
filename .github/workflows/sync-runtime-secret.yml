name: sync-runtime-secret

on:
  workflow_dispatch:
    inputs:
      logical_secret:
        description: Secret to provision
        required: true
        type: choice
        options:
          - stripe_test_secret_key
          - stripe_test_webhook_secret
          - stripe_live_secret_key
          - stripe_live_webhook_secret
          - openai_api_key
      target_environment:
        description: Protected GitHub Environment containing the input secret
        required: true
        type: environment

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
    env:
      GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      LOGICAL_SECRET: ${{ inputs.logical_secret }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT }}
      - name: Add Secret Manager version
        env:
          SECRET_VALUE: ${{ secrets.RUNTIME_SECRET_VALUE }}
        run: |
          set -euo pipefail
          case "$LOGICAL_SECRET" in
            stripe_test_secret_key) SECRET_NAME="dadeto-stripe-secret-key-test" ;;
            stripe_test_webhook_secret) SECRET_NAME="dadeto-stripe-webhook-secret-test" ;;
            stripe_live_secret_key) SECRET_NAME="dadeto-stripe-secret-key-prod" ;;
            stripe_live_webhook_secret) SECRET_NAME="dadeto-stripe-webhook-secret-prod" ;;
            openai_api_key) SECRET_NAME="dadeto-openai-api-key-prod" ;;
            *) echo "Unsupported logical secret" >&2; exit 1 ;;
          esac
          test -n "$SECRET_VALUE"
          VERSION="$(printf '%s' "$SECRET_VALUE" | gcloud secrets versions add "$SECRET_NAME" --project="$GOOGLE_PROJECT" --data-file=- --format='value(name.basename())')"
          echo "Created Secret Manager version ${VERSION} for ${SECRET_NAME}"
