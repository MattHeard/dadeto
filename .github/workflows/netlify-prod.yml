name: Deploy to Netlify (prod)

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4 # pick the node version your build needs
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Configure production rental search endpoint
        env:
          OBJECT_MINUTE_RENTAL_SEARCH_URL: ${{ vars.OBJECT_MINUTE_RENTAL_SEARCH_URL }}
        run: |
          if [ -z "$OBJECT_MINUTE_RENTAL_SEARCH_URL" ]; then
            echo "::error::Set the OBJECT_MINUTE_RENTAL_SEARCH_URL Actions variable from the Terraform output before deploying the static site."
            exit 1
          fi
          echo "DADETO_BUILD_TARGET=production" >> "$GITHUB_ENV"
          echo "OBJECT_MINUTE_RENTAL_SEARCH_URL=$OBJECT_MINUTE_RENTAL_SEARCH_URL" >> "$GITHUB_ENV"

      - run: npm run build:browser

      - run: npm install -g netlify-cli@17 # pin CLI version

      - name: Deploy to Netlify production
        run: |
          echo "🟢 Starting production deploy…"
          netlify deploy --prod --dir=public --message "GitHub ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
