name: Deploy to Netlify (prod)

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4 # pick the node version your build needs
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Configure production rental search endpoint from registry
        env:
          FUNCTION_ENDPOINT_REGISTRY_URL: https://storage.googleapis.com/irien-465710-function-endpoints/function-endpoints.json
          FUNCTION_ENDPOINT_REGISTRY_EVIDENCE_PATH: ${{ runner.temp }}/function-endpoint-registry-observation.json
        run: node .github/scripts/fetch-function-endpoint-registry.js

      - run: npm run build:browser

      - name: Verify production rental search endpoint
        run: |
          PAGE="public/object-minute-rental-search/index.html"
          if ! grep -Eq 'data-search-endpoint="https://[^"]+"' "$PAGE"; then
            echo "::error::Production rental search page must embed an HTTPS endpoint."
            exit 1
          fi

      - run: npm install -g netlify-cli@17 # pin CLI version

      - name: Deploy to Netlify production
        run: |
          echo "🟢 Starting production deploy…"
          netlify deploy --prod --dir=public --message "GitHub ${{ github.sha }}" --json > "$RUNNER_TEMP/netlify-deployment.json"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Attach Netlify deployment identity to registry observation
        run: node .github/scripts/attach-netlify-deployment-evidence.js "$RUNNER_TEMP/netlify-deployment.json" "$RUNNER_TEMP/function-endpoint-registry-observation.json"

      - name: Upload function endpoint registry observation
        uses: actions/upload-artifact@v6
        with:
          name: function-endpoint-registry-observation
          path: ${{ runner.temp }}/function-endpoint-registry-observation.json
          if-no-files-found: error
          retention-days: 90
