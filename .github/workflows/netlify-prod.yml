name: Deploy to Netlify (prod)

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'

  workflow_dispatch:
    inputs:
      gcp_prod_run_id:
        description: Successful gcp-prod run containing the endpoint artifact
        required: true
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4 # pick the node version your build needs
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Configure production rental search endpoint
        env:
          GH_TOKEN: ${{ github.token }}
          GCP_PROD_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.gcp_prod_run_id || '' }}
        run: bash .github/scripts/resolve-netlify-rental-endpoint.sh

      - run: npm run build:browser

      - name: Verify production rental search endpoint
        run: |
          PAGE="public/object-minute-rental-search/index.html"
          if ! grep -Eq 'data-search-endpoint="https://[^"]+"' "$PAGE"; then
            echo "::error::Production rental search page must embed an HTTPS endpoint."
            exit 1
          fi

      - run: npm install -g netlify-cli@17 # pin CLI version

      - name: Deploy to Netlify production
        run: |
          echo "🟢 Starting production deploy…"
          netlify deploy --prod --dir=public --message "GitHub ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
