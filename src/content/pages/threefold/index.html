<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#102823" />
    <meta
      name="description"
      content="A scale-shifting handheld RPG prototype at Harrowfen's Broken Gate."
    />
    <title>THREEFOLD — The Weight of Water</title>
    <link rel="stylesheet" href="/threefold/styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="THREEFOLD handheld game">
      <div class="screen-frame">
        <div class="screen-glow">
          <canvas
            id="game-screen"
            width="160"
            height="144"
            aria-label="THREEFOLD 160 by 144 pixel game screen"
          ></canvas>
        </div>
        <div class="screen-caption visually-hidden">
          <span>THREEFOLD · 160 × 144</span>
          <span id="game-status" aria-live="polite">Starting…</span>
        </div>
        <p id="game-load-error" class="game-load-error" role="alert" hidden>
          The game could not start. <a href="/threefold/">Reload the game</a>
        </p>
      </div>
      <div class="touch-pad" aria-label="Eight-button game controls">
        <div class="dpad">
          <button data-action="up" aria-label="Up">▲</button>
          <button data-action="left" aria-label="Left">◀</button>
          <button data-action="down" aria-label="Down">▼</button>
          <button data-action="right" aria-label="Right">▶</button>
        </div>
        <div class="touch-actions">
          <div class="face-buttons" aria-label="A and B buttons">
            <button data-action="b" aria-label="B">B</button>
            <button data-action="a" aria-label="A">A</button>
          </div>
          <div class="system-buttons">
            <button data-action="x" aria-label="X">X</button>
            <button data-action="y" aria-label="Y">Y</button>
          </div>
        </div>
      </div>
      <p id="logical-grid-warning" hidden></p>
      <p id="campaign-persistence" hidden></p>
      <section class="runtime-utilities" hidden aria-hidden="true">
        <select id="save-slot"><option value="0">01</option></select>
        <button id="save-game" type="button">Save</button>
        <button id="export-game" type="button">Export region</button>
        <button id="import-button" type="button">Import region</button>
        <button id="export-campaign" type="button">Backup campaign</button>
        <button id="import-campaign-button" type="button">Restore campaign</button>
        <input id="import-game" type="file" accept="application/json,.json" />
        <input id="import-campaign" type="file" accept="application/json,.json" />
        <button id="pause-game" type="button">Pause</button>
        <button id="resume-game" type="button">Resume</button>
        <button id="fullscreen-game" type="button">Fullscreen</button>
        <button id="reset-game" type="button">Reset</button>
      </section>
    </main>
    <script type="module" src="/threefold/game.js"></script>
  </body>
</html>
